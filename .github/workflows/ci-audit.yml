name: HeyBroc CI & Compliance Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly zero-credit health, rubric/90-day provenance, build & CVE check (11:17 UTC / 3:17 AM PT; off-minute avoids runner queue spikes)
    - cron: "17 11 * * *"
  workflow_dispatch:

concurrency:
  group: ci-audit-${{ github.event_name == 'schedule' && 'schedule' || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, Rubric Checks, Build & Static Compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit Production Dependencies for Security Vulnerabilities
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            npm audit --omit=dev --audit-level=high
          else
            npm audit --omit=dev --audit-level=critical
            if ! npm audit --omit=dev --audit-level=high >/dev/null 2>&1; then
              echo "::warning::High-severity npm advisory detected in production dependencies (run 'npm audit --omit=dev' or let autonomous-maintenance-loop patch it)."
            fi
          fi

      - name: Run TypeScript & Next.js Route Typecheck
        run: npm run typecheck

      - name: Run HeyBroc Rubric & Security Regression Suite
        run: npm run test:rubric

      - name: Run Next.js Production Build
        run: npm run build

      - name: Run Static Diff Compliance Check (Local Only)
        run: node scripts/ai-audit.mjs --skip-build
