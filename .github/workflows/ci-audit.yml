name: HeyBroc CI & Automated AI Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-and-audit:
    name: Typecheck, 487 Rubric Checks, Build & AI Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript & Next.js Route Typecheck
        run: npm run typecheck

      - name: Run HeyBroc Rubric & Security Regression Suite
        run: npm run test:rubric

      - name: Run Next.js Production Build
        run: npm run build

      - name: Run Static Compliance & Cross-AI Diff Audit (Codex / Claude)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/ai-audit.mjs --skip-build
