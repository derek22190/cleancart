name: HeyBroc CI & Compliance Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, Rubric Checks, Build & Static Compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript & Next.js Route Typecheck
        run: npm run typecheck

      - name: Run HeyBroc Rubric & Security Regression Suite
        run: npm run test:rubric

      - name: Run Next.js Production Build
        run: npm run build

      - name: Run Static Diff Compliance Check (Local Only)
        run: node scripts/ai-audit.mjs --skip-build
