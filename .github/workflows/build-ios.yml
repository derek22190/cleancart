name: Build HeyBroc iOS & Safari Extension (No-Mac Cloud Builder)

# Builds on GitHub's cloud macOS runner (no Mac needed!) automatically whenever ios-app/
# or this workflow changes on main, or manually via workflow_dispatch.
# When App Store Connect API secrets (ASC_KEY_ID, ASC_ISSUER_ID, ASC_PRIVATE_KEY_BASE64, APPLE_TEAM_ID)
# are configured in GitHub Settings -> Secrets, it signs and uploads the .ipa directly to TestFlight.
on:
  push:
    branches:
      - main
    paths:
      - "ios-app/**"
      - ".github/workflows/build-ios.yml"
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: "Sign & upload .ipa directly to TestFlight (requires ASC_* secrets)"
        required: false
        default: "true"

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Convert Safari Web Extension into Xcode Project
        run: |
          xcrun safari-web-extension-converter ios-app/SafariExtension/Resources \
            --project-location ios-app/build \
            --app-name "HeyBroc" \
            --bundle-identifier "com.heybroc.app" \
            --swift \
            --ios-only \
            --no-open \
            --no-prompt \
            --force

      - name: Inject Native HeyBroc Scanner UI, Camera Permissions, Icon & Build Version
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import plistlib
          import re
          import shutil

          build_root = pathlib.Path("ios-app/build/HeyBroc")
          run_num = int(os.environ.get("GITHUB_RUN_NUMBER", "1") or "1")
          build_version = str(100 + run_num)
          marketing_version = "2.1.0"

          # 1. Replace Apple's static Safari placeholder ViewController.swift with full HeyBroc native iOS controller
          #    and stage LiveStoreBrowserViewController.swift + HeyBrocShortcuts.swift alongside it.
          vc_files = list(build_root.rglob("ViewController.swift"))
          if not vc_files:
              raise SystemExit("ERROR: ViewController.swift not found in generated Xcode project")
          for vc in vc_files:
              shutil.copy2("ios-app/App/ViewController.swift", vc)
              shutil.copy2("ios-app/App/LiveStoreBrowserViewController.swift", vc.parent / "LiveStoreBrowserViewController.swift")
              shutil.copy2("ios-app/App/HeyBrocShortcuts.swift", vc.parent / "HeyBrocShortcuts.swift")
              print(f"Injected ViewController.swift, LiveStoreBrowserViewController.swift & HeyBrocShortcuts.swift -> {vc.parent}")

          # 2. Replace Apple's static "You can turn on HeyBroc's Safari extension in Settings." Main.html
          main_html_files = list(build_root.rglob("Main.html"))
          if not main_html_files:
              raise SystemExit("ERROR: Main.html not found in generated Xcode project")
          for mh in main_html_files:
              shutil.copy2("ios-app/App/Main.html", mh)
              print(f"Injected interactive Main.html -> {mh}")

          # 3. Copy Apple Privacy Manifest & crisp 1024x1024 App Icon
          shutil.copy2("ios-app/App/PrivacyInfo.xcprivacy", build_root / "PrivacyInfo.xcprivacy")
          for vc in vc_files:
              shutil.copy2("ios-app/App/PrivacyInfo.xcprivacy", vc.parent / "PrivacyInfo.xcprivacy")

          icon_src = pathlib.Path("store-assets/apple-app-store/icon-1024x1024.png")
          for icon_png in build_root.rglob("Icon.png"):
              shutil.copy2(icon_src, icon_png)

          for appicon_dir in build_root.rglob("AppIcon.appiconset"):
              for existing in appicon_dir.glob("*.png"):
                  existing.unlink()
              shutil.copy2(icon_src, appicon_dir / "icon-1024x1024.png")
              contents = {
                  "images": [
                      {
                          "filename": "icon-1024x1024.png",
                          "idiom": "universal",
                          "platform": "ios",
                          "size": "1024x1024",
                      }
                  ],
                  "info": {"author": "xcode", "version": 1},
              }
              (appicon_dir / "Contents.json").write_text(json.dumps(contents, indent=2) + "\n")
              print(f"Configured 1024x1024 AppIcon -> {appicon_dir}")

          # 4. Stage Native iOS Share Sheet Extension (HeyBrocShare) files BEFORE patching all Info.plists
          share_dir = build_root / "HeyBrocShare"
          share_dir.mkdir(parents=True, exist_ok=True)
          shutil.copy2("ios-app/ShareExtension/ShareViewController.swift", share_dir / "ShareViewController.swift")
          shutil.copy2("ios-app/ShareExtension/Info.plist", share_dir / "Info.plist")
          shutil.copy2("ios-app/App/PrivacyInfo.xcprivacy", share_dir / "PrivacyInfo.xcprivacy")
          print(f"Staged HeyBrocShare extension sources -> {share_dir}")

          # 5. Patch ALL Info.plist files (camera, photo library, export compliance, emoji-free CFBundleDisplayName, synced versions)
          cam_desc = "HeyBroc uses the camera when you choose to scan a food or cosmetic barcode or ingredient label to calculate its 0-100 health score."
          photo_desc = "HeyBroc lets you choose a barcode or ingredient label photo from your library to calculate its 0-100 health score."

          for plist_path in build_root.rglob("Info.plist"):
              with plist_path.open("rb") as f:
                  data = plistlib.load(f)
              is_extension = "NSExtension" in data
              data["CFBundleDisplayName"] = "HeyBroc"
              data["CFBundleShortVersionString"] = marketing_version
              data["CFBundleVersion"] = build_version
              if is_extension:
                  data["CFBundlePackageType"] = "XPC!"
              else:
                  data["NSCameraUsageDescription"] = cam_desc
                  data["NSPhotoLibraryUsageDescription"] = photo_desc
                  data["ITSAppUsesNonExemptEncryption"] = False
              with plist_path.open("wb") as f:
                  plistlib.dump(data, f)
              print(f"Updated Info.plist ({'extension' if is_extension else 'host app'}) -> {plist_path}")

          # 6. Patch project.pbxproj bundle ID, MARKETING_VERSION, CURRENT_PROJECT_VERSION & generated plist keys
          pbx_path = build_root / "HeyBroc.xcodeproj" / "project.pbxproj"
          pbx = pbx_path.read_text()
          pbx = pbx.replace("com.heybroc.HeyBroc", "com.heybroc.app")
          pbx = re.sub(r"MARKETING_VERSION\s*=\s*[^;]+;", f"MARKETING_VERSION = {marketing_version};", pbx)
          pbx = re.sub(r"CURRENT_PROJECT_VERSION\s*=\s*[^;]+;", f"CURRENT_PROJECT_VERSION = {build_version};", pbx)

          extra_keys = (
              f'INFOPLIST_KEY_ITSAppUsesNonExemptEncryption = NO;\n'
              f'\t\t\t\tINFOPLIST_KEY_NSCameraUsageDescription = "{cam_desc}";\n'
              f'\t\t\t\tINFOPLIST_KEY_NSPhotoLibraryUsageDescription = "{photo_desc}";\n'
              f'\t\t\t\tPRODUCT_BUNDLE_IDENTIFIER = com.heybroc.app;'
          )
          pbx = re.sub(r'PRODUCT_BUNDLE_IDENTIFIER\s*=\s*"?com\.heybroc\.app"?;', extra_keys, pbx)
          pbx_path.write_text(pbx)
          print(f"Patched project.pbxproj -> version {marketing_version} ({build_version})")
          PY

      - name: Set up Ruby 3.3 for Xcodeproj
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Wire Live Store Browser, AppIntents & Native Share Extension Target in Xcode Project
        run: |
          gem install xcodeproj --no-document
          ruby - <<'RUBY'
          require 'xcodeproj'
          require 'fileutils'

          proj_path = 'ios-app/build/HeyBroc/HeyBroc.xcodeproj'
          project = Xcodeproj::Project.open(proj_path)
          run_num = (ENV['GITHUB_RUN_NUMBER'] || '1').to_i
          build_version = (100 + run_num).to_s
          marketing_version = '2.1.0'

          app_target = project.targets.find { |t| t.product_type == 'com.apple.product-type.application' }
          raise 'Host application target not found in generated Xcode project' unless app_target

          vc_ref = project.files.find { |f| f.path&.end_with?('ViewController.swift') }
          raise 'ViewController.swift file reference not found' unless vc_ref
          app_group = vc_ref.parent
          vc_dir_prefix = File.dirname(vc_ref.path)

          ['LiveStoreBrowserViewController.swift', 'HeyBrocShortcuts.swift'].each do |fname|
            rel_path = (vc_dir_prefix == '.' || vc_dir_prefix.empty?) ? fname : "#{vc_dir_prefix}/#{fname}"
            ref = app_group.files.find { |f| f.path == rel_path } || app_group.new_file(rel_path)
            unless app_target.source_build_phase.files_references.include?(ref)
              app_target.add_file_references([ref])
            end
            puts "Added #{rel_path} to #{app_target.name} Compile Sources"
          end

          project.targets.each do |t|
            t.build_configurations.each do |cfg|
              cur = (cfg.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] || '15.0').to_f
              cfg.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0' if cur < 15.0
            end
          end

          project.save
          FileUtils.cp("#{proj_path}/project.pbxproj", "#{proj_path}/project.pbxproj.minimal")
          puts "Saved fallback project.pbxproj.minimal"

          # Add Sign in with Apple entitlement for ASAuthorizationAppleIDProvider (Guideline 4.8)
          entitlements_path = 'ios-app/build/HeyBroc/HeyBroc.entitlements'
          File.write(entitlements_path, <<~PLIST)
            <?xml version="1.0" encoding="UTF-8"?>
            <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
            <plist version="1.0">
            <dict>
              <key>com.apple.developer.applesignin</key>
              <array>
                <string>Default</string>
              </array>
            </dict>
            </plist>
          PLIST
          app_target.build_configurations.each do |cfg|
            cfg.build_settings['CODE_SIGN_ENTITLEMENTS'] = 'HeyBroc.entitlements'
          end
          project.save
          FileUtils.cp("#{proj_path}/project.pbxproj", "#{proj_path}/project.pbxproj.no-share")
          puts "Saved fallback project.pbxproj.no-share (with Sign in with Apple entitlement)"

          # Add Native iOS Share Sheet Extension target (HeyBrocShare -> com.heybroc.app.ShareExtension)
          share_target = project.new_target(:app_extension, 'HeyBrocShare', :ios, '15.0')
          share_group = project.main_group.new_group('HeyBrocShare', 'HeyBrocShare', :project)
          share_vc_ref = share_group.new_file('ShareViewController.swift')
          share_group.new_file('Info.plist')
          share_privacy_ref = share_group.new_file('PrivacyInfo.xcprivacy')

          share_target.add_file_references([share_vc_ref])
          share_target.resources_build_phase.add_file_reference(share_privacy_ref, true)

          share_target.build_configurations.each do |cfg|
            cfg.build_settings['PRODUCT_NAME'] = '$(TARGET_NAME)'
            cfg.build_settings['PRODUCT_MODULE_NAME'] = 'HeyBrocShare'
            cfg.build_settings['PRODUCT_BUNDLE_IDENTIFIER'] = 'com.heybroc.app.ShareExtension'
            cfg.build_settings['PRODUCT_BUNDLE_PACKAGE_TYPE'] = 'XPC!'
            cfg.build_settings['INFOPLIST_FILE'] = 'HeyBrocShare/Info.plist'
            cfg.build_settings['GENERATE_INFOPLIST_FILE'] = 'NO'
            cfg.build_settings['MARKETING_VERSION'] = marketing_version
            cfg.build_settings['CURRENT_PROJECT_VERSION'] = build_version
            cfg.build_settings['SWIFT_VERSION'] = '5.0'
            cfg.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
            cfg.build_settings['TARGETED_DEVICE_FAMILY'] = '1,2'
            cfg.build_settings['SKIP_INSTALL'] = 'YES'
            cfg.build_settings['APPLICATION_EXTENSION_API_ONLY'] = 'YES'
            cfg.build_settings['CODE_SIGN_STYLE'] = 'Automatic'
          end

          app_target.add_dependency(share_target)

          embed_phase = app_target.copy_files_build_phases.find { |p| p.symbol_dst_subfolder_spec == :plug_ins } ||
                        app_target.new_copy_files_build_phase('Embed App Extensions')
          embed_phase.symbol_dst_subfolder_spec = :plug_ins
          build_file = embed_phase.add_file_reference(share_target.product_reference, true)
          build_file.settings = { 'ATTRIBUTES' => ['RemoveHeadersOnCopy', 'CodeSignOnCopy'] }

          project.save
          puts "Added HeyBrocShare.appex (com.heybroc.app.ShareExtension) to #{app_target.name}"
          RUBY

      - name: Build unsigned iOS Release Archive (Verification)
        if: ${{ github.event.inputs.upload_to_testflight == 'false' || env.ASC_KEY_ID == '' }}
        run: |
          xcodebuild -project "ios-app/build/HeyBroc/HeyBroc.xcodeproj" \
            -scheme "HeyBroc" \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Cloud-Sign & Upload .ipa to TestFlight (No Mac Required)
        if: ${{ github.event.inputs.upload_to_testflight != 'false' && env.ASC_KEY_ID != '' }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys ~/.private_keys ~/private_keys
          echo "$ASC_PRIVATE_KEY_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          cp ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 ~/.private_keys/
          cp ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 ~/private_keys/
          cat > ios-app/build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          xcodebuild -project "ios-app/build/HeyBroc/HeyBroc.xcodeproj" \
            -scheme "HeyBroc" \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "ios-app/build/HeyBroc.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive
          if ! xcodebuild -exportArchive \
            -archivePath "ios-app/build/HeyBroc.xcarchive" \
            -exportOptionsPlist "ios-app/build/ExportOptions.plist" \
            -exportPath "ios-app/build/ipa" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"; then
            echo "::warning::App Store Connect API key could not auto-provision ShareExtension; re-archiving with Sign in with Apple + StoreKit 2 + LiveStoreBrowser."
            cp "ios-app/build/HeyBroc/HeyBroc.xcodeproj/project.pbxproj.no-share" "ios-app/build/HeyBroc/HeyBroc.xcodeproj/project.pbxproj"
            rm -rf "ios-app/build/HeyBroc.xcarchive" "ios-app/build/ipa"
            xcodebuild -project "ios-app/build/HeyBroc/HeyBroc.xcodeproj" \
              -scheme "HeyBroc" \
              -sdk iphoneos \
              -configuration Release \
              -archivePath "ios-app/build/HeyBroc.xcarchive" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              archive
            if ! xcodebuild -exportArchive \
              -archivePath "ios-app/build/HeyBroc.xcarchive" \
              -exportOptionsPlist "ios-app/build/ExportOptions.plist" \
              -exportPath "ios-app/build/ipa" \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
              -authenticationKeyID "$ASC_KEY_ID" \
              -authenticationKeyIssuerID "$ASC_ISSUER_ID"; then
              echo "::warning::Sign in with Apple capability not yet enabled on com.heybroc.app in Apple Developer Portal; re-archiving with StoreKit 2 + Web Apple OAuth fallback so TestFlight upload succeeds immediately."
              cp "ios-app/build/HeyBroc/HeyBroc.xcodeproj/project.pbxproj.minimal" "ios-app/build/HeyBroc/HeyBroc.xcodeproj/project.pbxproj"
              rm -rf "ios-app/build/HeyBroc.xcarchive" "ios-app/build/ipa"
              xcodebuild -project "ios-app/build/HeyBroc/HeyBroc.xcodeproj" \
                -scheme "HeyBroc" \
                -sdk iphoneos \
                -configuration Release \
                -archivePath "ios-app/build/HeyBroc.xcarchive" \
                CODE_SIGNING_ALLOWED=NO \
                CODE_SIGNING_REQUIRED=NO \
                CODE_SIGN_IDENTITY="" \
                archive
              xcodebuild -exportArchive \
                -archivePath "ios-app/build/HeyBroc.xcarchive" \
                -exportOptionsPlist "ios-app/build/ExportOptions.plist" \
                -exportPath "ios-app/build/ipa" \
                -allowProvisioningUpdates \
                -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
                -authenticationKeyID "$ASC_KEY_ID" \
                -authenticationKeyIssuerID "$ASC_ISSUER_ID"
            fi
          fi
          xcrun altool --upload-app \
            --type ios \
            --file "ios-app/build/ipa/HeyBroc.ipa" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

          ruby - <<'RUBY'
          require 'openssl'
          require 'base64'
          require 'json'
          require 'net/http'
          require 'uri'

          key_id = ENV['ASC_KEY_ID'].to_s.strip
          issuer_id = ENV['ASC_ISSUER_ID'].to_s.strip
          pem = Base64.decode64(ENV['ASC_PRIVATE_KEY_BASE64'].to_s)
          build_version = (100 + (ENV['GITHUB_RUN_NUMBER'] || '1').to_i).to_s

          def b64u(data)
            Base64.urlsafe_encode64(data, padding: false)
          end

          def asc_token(key_id, issuer_id, pem)
            now = Time.now.to_i
            hdr = b64u({ alg: 'ES256', kid: key_id, typ: 'JWT' }.to_json)
            pay = b64u({ iss: issuer_id, iat: now, exp: now + 1000, aud: 'appstoreconnect-v1' }.to_json)
            signing_input = "#{hdr}.#{pay}"
            ec = OpenSSL::PKey::EC.new(pem)
            der_sig = ec.sign('SHA256', signing_input)
            asn1 = OpenSSL::ASN1.decode(der_sig)
            r = asn1.value[0].value.to_s(2).rjust(32, "\x00")[-32, 32]
            s = asn1.value[1].value.to_s(2).rjust(32, "\x00")[-32, 32]
            "#{signing_input}.#{b64u(r + s)}"
          end

          def asc_req(method, path, token, body = nil)
            uri = URI("https://api.appstoreconnect.apple.com#{path}")
            http = Net::HTTP.new(uri.host, uri.port)
            http.use_ssl = true
            req = case method
                  when :get then Net::HTTP::Get.new(uri)
                  when :post then Net::HTTP::Post.new(uri)
                  when :patch then Net::HTTP::Patch.new(uri)
                  end
            req['Authorization'] = "Bearer #{token}"
            req['Content-Type'] = 'application/json'
            req.body = body.to_json if body
            res = http.request(req)
            parsed = (JSON.parse(res.body) rescue { 'raw' => res.body })
            [res.code.to_i, parsed]
          end

          token = asc_token(key_id, issuer_id, pem)
          code, apps_res = asc_req(:get, '/v1/apps?filter[bundleId]=com.heybroc.app', token)
          app = (apps_res['data'] || []).first
          unless app
            puts "::warning::Could not look up app com.heybroc.app via ASC API (HTTP #{code}): #{apps_res}"
            exit 0
          end
          app_id = app['id']
          puts "ASC App ID for com.heybroc.app: #{app_id}"

          # Show the last 12 builds in App Store Connect so we know exact processingStatus of 105..116
          _, hist = asc_req(:get, "/v1/builds?filter[app]=#{app_id}&sort=-uploadedDate&limit=12&include=preReleaseVersion,buildBetaDetail", token)
          inc_map = {}
          (hist['included'] || []).each { |obj| inc_map["#{obj['type']}:#{obj['id']}"] = obj['attributes'] || {} }
          puts '--- Recent Builds in App Store Connect ---'
          (hist['data'] || []).each do |b|
            a = b['attributes'] || {}
            prv_id = b.dig('relationships', 'preReleaseVersion', 'data', 'id')
            bbd_id = b.dig('relationships', 'buildBetaDetail', 'data', 'id')
            mkt_ver = prv_id ? inc_map.dig("preReleaseVersions:#{prv_id}", 'version') : nil
            bbd = bbd_id ? inc_map["buildBetaDetails:#{bbd_id}"] : {}
            puts "Build #{mkt_ver || '?'} (#{a['version']}) | state=#{a['processingState']} | expired=#{a['expired']} | nonExemptEnc=#{a['usesNonExemptEncryption'].inspect} | int=#{bbd['internalBuildState']} | ext=#{bbd['externalBuildState']} | uploaded=#{a['uploadedDate']}"
          end

          # Poll for newly uploaded build
          target_build = nil
          24.times do |i|
            token = asc_token(key_id, issuer_id, pem) if i == 12
            _, b_res = asc_req(:get, "/v1/builds?filter[app]=#{app_id}&filter[version]=#{build_version}&limit=5", token)
            target_build = (b_res['data'] || []).first
            if target_build
              state = target_build.dig('attributes', 'processingState')
              puts "[poll #{i + 1}] Build #{build_version} (#{target_build['id']}) state=#{state}"
              break if state != 'PROCESSING'
            else
              puts "[poll #{i + 1}] Waiting for Build #{build_version} to register in App Store Connect..."
            end
            sleep 15
          end

          unless target_build
            puts "::warning::Build #{build_version} did not finish appearing in ASC API within 6 min."
            exit 0
          end

          build_id = target_build['id']
          state = target_build.dig('attributes', 'processingState')
          if state != 'VALID'
            puts "::warning::Build #{build_version} ended with processingState=#{state}: #{target_build.to_json}"
            exit 0
          end

          if target_build.dig('attributes', 'usesNonExemptEncryption').nil?
            pcode, pres = asc_req(:patch, "/v1/builds/#{build_id}", token, {
              data: { type: 'builds', id: build_id, attributes: { usesNonExemptEncryption: false } }
            })
            puts "Cleared Export Compliance for build #{build_id}: HTTP #{pcode} #{pcode >= 400 ? pres.to_json : ''}"
          end

          _, beta_detail = asc_req(:get, "/v1/builds/#{build_id}/buildBetaDetail", token)
          puts "BuildBetaDetail: #{beta_detail.dig('data', 'attributes').to_json}"

          _, groups_res = asc_req(:get, "/v1/apps/#{app_id}/betaGroups", token)
          groups = groups_res['data'] || []
          puts "Found #{groups.length} TestFlight Beta Group(s):"
          has_external = false
          groups.each do |g|
            ga = g['attributes'] || {}
            gid = g['id']
            is_int = ga['isInternalGroup']
            has_external = true unless is_int
            gcode, gres = asc_req(:post, "/v1/betaGroups/#{gid}/relationships/builds", token, {
              data: [{ type: 'builds', id: build_id }]
            })
            puts "  - Group '#{ga['name']}' (internal=#{is_int}, publicLink=#{ga['publicLinkEnabled']}) -> assign build HTTP #{gcode} #{gcode >= 400 ? gres.to_json : 'OK'}"
          end

          if has_external
            rcode, rres = asc_req(:post, '/v1/betaAppReviewSubmissions', token, {
              data: {
                type: 'betaAppReviewSubmissions',
                relationships: {
                  build: { data: { type: 'builds', id: build_id } }
                }
              }
            })
            puts "BetaAppReviewSubmission HTTP #{rcode}: #{rcode >= 400 ? rres.to_json : 'SUBMITTED'}"
          end
          RUBY

      - name: Upload Xcode Project & Built App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: heybroc-ios-xcode-bundle
