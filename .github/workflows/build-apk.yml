name: Build CleanCart APK

on:
  push:
    paths-ignore:
      - "public/heybroc.apk"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;35.0.0"

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD secrets must all be configured." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/heybroc-release.jks"

      - name: Build release APK & App Bundle
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/heybroc-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          API_BASE="${{ vars.CLEANCART_API_BASE }}"
          set +e
          if [ -n "$API_BASE" ]; then
            ./gradlew assembleRelease bundleRelease --stacktrace -PcleancartApiBase="$API_BASE" 2>&1 | tee gradle-build.log
            STATUS=${PIPESTATUS[0]}
          else
            ./gradlew assembleRelease bundleRelease --stacktrace 2>&1 | tee gradle-build.log
            STATUS=${PIPESTATUS[0]}
          fi
          set -e
          if [ "$STATUS" -ne 0 ]; then
            grep -E "(^e: |FAILURE:|What went wrong:|^\* |> Task .* FAILED|Error:)" gradle-build.log | head -n 25 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit "$STATUS"
          fi
          cp app/build/outputs/apk/release/app-release.apk cleancart-release.apk

      - name: Clean up decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/heybroc-release.jks"

      - name: Publish updated APK to public/heybroc.apk
        if: github.ref == 'refs/heads/main'
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "derek22190"
          git config user.email "53961265+derek22190@users.noreply.github.com"
          cp android-app/cleancart-release.apk public/heybroc.apk
          if ! git diff --quiet public/heybroc.apk; then
            git add public/heybroc.apk
            git commit -m "Update public/heybroc.apk with latest Android release build"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cleancart-release.apk
          path: android-app/cleancart-release.apk
          if-no-files-found: error

      - name: Upload release App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: heybroc-release.aab
          path: android-app/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
