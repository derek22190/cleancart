<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>HeyBroc settings</title>
  <style>
    body { width: 300px; margin: 0; padding: 16px; font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: #15201b; background: #f4f3ee; }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .brand img { width: 38px; height: 38px; border-radius: 10px; object-fit: contain; background: #fff; border: 1px solid rgba(15, 122, 74, 0.22); }
    h1 { font-size: 16px; margin: 0; }
    p { margin: 0 0 12px; color: #4a5550; }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    input { width: 100%; box-sizing: border-box; padding: 9px 10px; border-radius: 10px; border: 1px solid #d8d9d3; font: inherit; }
    button { margin-top: 10px; width: 100%; padding: 10px; border: 0; border-radius: 999px; background: #0f7a4a; color: #fff; font-weight: 700; cursor: pointer; }
    button.secondary { background: #eff1f0; color: #15201b; border: 1px solid #d8d9d3; margin-top: 8px; }
    #status { margin-top: 8px; min-height: 18px; color: #0f7a4a; font-weight: 600; }
  </style>
</head>
<body>
  <div class="brand">
    <img src="broc-mascot.png" alt="HeyBroc mascot" />
    <h1>HeyBroc PureOverlay</h1>
  </div>
  <p>Point the extension at your HeyBroc API (local dev server or your deployed URL).</p>
  <label for="api">API base URL</label>
  <input id="api" placeholder="https://heybroc.com" />
  <button id="save">Save &amp; test</button>
  <a href="https://www.heybroc.com/?login=1" target="_blank" rel="noopener" style="display:block;margin-top:8px;padding:9px;border-radius:999px;background:#eff1f0;color:#15201b;text-align:center;font-weight:700;text-decoration:none;border:1px solid #d8d9d3;">👤 Log in / Sync Account →</a>
  <button id="manage-sub" class="secondary" type="button">Manage / Cancel subscription</button>
  <div style="margin-top:8px;text-align:center;font-size:11px;color:#64748b;">
    <a href="https://www.heybroc.com/terms" target="_blank" rel="noopener" style="color:#4a5550;">Terms</a> ·
    <a href="https://www.heybroc.com/privacy" target="_blank" rel="noopener" style="color:#4a5550;">Privacy</a>
  </div>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
