<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>HeyBroc PureOverlay</title>
  <style>
    :root {
      --green: #16a34a; --green-tint: #e8f7ee;
      --yellow: #ca8a04; --yellow-tint: #fef7e0;
      --red: #dc2626; --red-tint: #fdecec;
      --gray: #64748b; --gray-tint: #e2e8f0;
      --brand: #0f7a4a; --ink: #0f172a; --ink-2: #475569; --ink-3: #64748b;
    }
    * { box-sizing: border-box; }
    body {
      width: 336px; margin: 0; padding: 14px;
      font: 13px/1.42 "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      font-variant-numeric: tabular-nums;
      color: var(--ink); background: #f8faf9;
    }
    .tone-green { --tone: var(--green); --tone-tint: var(--green-tint); }
    .tone-yellow { --tone: var(--yellow); --tone-tint: var(--yellow-tint); }
    .tone-red { --tone: var(--red); --tone-tint: var(--red-tint); }
    .tone-gray { --tone: var(--gray); --tone-tint: var(--gray-tint); }

    .header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
    .brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
    .brand img { width: 34px; height: 34px; object-fit: contain; }
    .brand h1 { font-size: 15px; font-weight: 800; margin: 0; letter-spacing: -.01em; }
    .brand span { display: block; font-size: 10.5px; color: var(--ink-3); font-weight: 600; }
    .store-badge {
      padding: 3px 9px; border-radius: 999px; font-size: 10.5px; font-weight: 800;
      background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; white-space: nowrap;
      max-width: 145px; overflow: hidden; text-overflow: ellipsis;
    }

    .cart-card {
      padding: 12px; border-radius: 16px; background: #fff;
      border: 1px solid #e2e8f0; box-shadow: 0 4px 14px -6px rgba(15, 23, 42, 0.08);
    }
    .cart-summary { display: flex; align-items: center; gap: 12px; }
    .ring-wrap { position: relative; width: 64px; height: 64px; flex: none; }
    .ring-wrap svg { width: 100%; height: 100%; display: block; }
    .ring-track { fill: none; stroke: var(--tone-tint); stroke-width: 8; }
    .ring-fill { fill: none; stroke: var(--tone); stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset .45s ease; }
    .ring-label {
      position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .ring-label strong { font-size: 17px; font-weight: 800; line-height: 1; }
    .ring-label em { font-style: normal; font-size: 9.5px; font-weight: 800; color: var(--tone); margin-top: 2px; }

    .cart-copy { flex: 1; min-width: 0; }
    .cart-copy h2 { margin: 0; font-size: 13.5px; font-weight: 800; }
    .cart-copy p { margin: 2px 0 0; font-size: 11.5px; color: var(--ink-2); }
    .proj-chip {
      display: inline-block; margin-top: 5px; padding: 2px 7px; border-radius: 999px;
      font-size: 10px; font-weight: 800; background: #dcfce7; color: #166534;
    }

    .item-list {
      list-style: none; padding: 0; margin: 10px 0 0;
      display: flex; flex-direction: column; gap: 5px;
      max-height: 156px; overflow-y: auto;
    }
    .item-row {
      display: flex; align-items: center; gap: 7px; padding: 6px 8px;
      border-radius: 10px; background: #f8fafc; border: 1px solid #e2e8f0;
    }
    .item-title {
      flex: 1; min-width: 0; font-size: 11.5px; font-weight: 700;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .qty-pill { padding: 1px 5px; border-radius: 999px; font-size: 10px; font-weight: 800; background: #e2e8f0; color: #334155; }
    .score-pill { padding: 2px 7px; border-radius: 999px; font-size: 10.5px; font-weight: 800; color: var(--tone); background: var(--tone-tint); }
    .remove-btn {
      width: 20px; height: 20px; border: 0; border-radius: 50%; background: transparent;
      color: #94a3b8; font-size: 12px; font-weight: 700; cursor: pointer; padding: 0;
    }
    .remove-btn:hover { background: #fee2e2; color: #dc2626; }

    .actions { display: flex; flex-direction: column; gap: 7px; margin-top: 12px; }
    .btn-link, button.action-btn {
      display: block; width: 100%; padding: 9px 12px; border-radius: 999px; border: 0;
      font: inherit; font-size: 12.5px; font-weight: 800; text-align: center;
      text-decoration: none; cursor: pointer;
    }
    .btn-primary { background: var(--brand); color: #fff; }
    .btn-secondary { background: #fff; color: var(--ink); border: 1px solid #cbd5e1 !important; }

    details.settings { margin-top: 10px; padding-top: 8px; border-top: 1px solid #e2e8f0; }
    details.settings summary { font-size: 11.5px; font-weight: 700; color: var(--ink-2); cursor: pointer; }
    .settings-body { margin-top: 8px; }
    label { display: block; font-size: 11.5px; font-weight: 700; margin-bottom: 4px; color: var(--ink-2); }
    input { width: 100%; padding: 8px 10px; border-radius: 10px; border: 1px solid #cbd5e1; font: inherit; font-size: 12px; background: #fff; }
    #save { margin-top: 7px; }
    #status { margin-top: 6px; min-height: 16px; font-size: 11.5px; color: var(--brand); font-weight: 700; }
    .footer-links { margin-top: 8px; text-align: center; font-size: 11px; color: var(--ink-3); }
    .footer-links a { color: var(--ink-2); text-decoration: none; }
    .footer-links a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <img src="broc-mascot.png" alt="HeyBroc mascot" />
      <div>
        <h1>HeyBroc</h1>
        <span>Live Grocery Scanner</span>
      </div>
    </div>
    <span id="store-badge" class="store-badge">Grocery Cart</span>
  </div>

  <div id="cart-card" class="cart-card tone-gray">
    <div class="cart-summary">
      <div class="ring-wrap">
        <svg viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="40" class="ring-track"></circle>
          <circle id="ring-fill" cx="50" cy="50" r="40" class="ring-fill" stroke-dasharray="251.33" stroke-dashoffset="251.33" transform="rotate(-90 50 50)"></circle>
        </svg>
        <div class="ring-label">
          <strong id="avg-val">--</strong>
          <em id="avg-rating">Empty</em>
        </div>
      </div>
      <div class="cart-copy">
        <h2 id="cart-headline">Your store cart is empty</h2>
        <p id="cart-sub">Shop any supported grocery store to score your cart live.</p>
        <span id="proj-chip" class="proj-chip" hidden></span>
      </div>
    </div>
    <ul id="item-list" class="item-list" hidden></ul>
  </div>

  <div class="actions">
    <a id="upgrade-link" class="btn-link btn-primary" href="https://www.heybroc.com/?upgrade=1" target="_blank" rel="noopener">⚡ Upgrade to Family Pro →</a>
    <a id="login-link" class="btn-link btn-secondary" href="https://www.heybroc.com/?login=1" target="_blank" rel="noopener">👤 Log in / Sync Account →</a>
    <button id="manage-sub" class="action-btn btn-secondary" type="button">Manage / Cancel subscription</button>
  </div>

  <details class="settings">
    <summary>⚙️ API &amp; Connection Settings</summary>
    <div class="settings-body">
      <label for="api">API base URL</label>
      <input id="api" placeholder="https://www.heybroc.com" />
      <button id="save" class="action-btn btn-primary" type="button">Save &amp; test</button>
    </div>
  </details>

  <div id="status"></div>

  <div class="footer-links">
    <a href="https://www.heybroc.com/terms" target="_blank" rel="noopener">Terms</a> ·
    <a href="https://www.heybroc.com/privacy" target="_blank" rel="noopener">Privacy</a>
  </div>
  <script src="popup.js"></script>
</body>
</html>
